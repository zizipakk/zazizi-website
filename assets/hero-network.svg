<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 600">

  <defs>

    <linearGradient id="lineGradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%"
            stop-color="#2563eb"/>

      <stop offset="100%"
            stop-color="#60a5fa"/>

    </linearGradient>

  </defs>

  <g stroke="url(#lineGradient)"
     stroke-width="3"
     fill="none"
     opacity="0.8">

    <line x1="120" y1="120"
          x2="320" y2="160"/>

    <line x1="320" y1="160"
          x2="520" y2="110"/>

    <line x1="320" y1="160"
          x2="280" y2="350"/>

    <line x1="280" y1="350"
          x2="520" y2="350"/>

    <line x1="520" y1="110"
          x2="680" y2="250"/>

    <line x1="520" y1="350"
          x2="680" y2="250"/>

    <line x1="120" y1="120"
          x2="280" y2="350"/>

  </g>

  <g fill="#2563eb">

    <circle cx="120" cy="120" r="12"/>
    <circle cx="320" cy="160" r="12"/>
    <circle cx="520" cy="110" r="12"/>
    <circle cx="280" cy="350" r="12"/>
    <circle cx="520" cy="350" r="12"/>
    <circle cx="680" cy="250" r="12"/>

  </g>

  <g fill="#0b1324">

    <circle cx="120" cy="120" r="5"/>
    <circle cx="320" cy="160" r="5"/>
    <circle cx="520" cy="110" r="5"/>
    <circle cx="280" cy="350" r="5"/>
    <circle cx="520" cy="350" r="5"/>
    <circle cx="680" cy="250" r="5"/>

  </g>

</svg>